<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111b32">
  <title>RestaurantOrders · License Manager</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #172033;
      --muted: #71809a;
      --line: #e4e9f2;
      --blue: #315bd6;
      --blue-dark: #2549b7;
      --nav: #111b32;
      --green: #15845b;
      --red: #bb352f;
      --surface: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: #f4f6fb; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 22px; background: radial-gradient(ellipse at 50% 0, #e8edff, #f4f6fb 54%); }
    .login-card { width: min(460px, 100%); padding: 34px; border: 1px solid var(--line); border-radius: 22px; background: white; box-shadow: 0 24px 70px #17294e16; }
    .brand-mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; color: #fff; background: linear-gradient(145deg, #4c78f0, #2849b8); font-size: 22px; box-shadow: 0 10px 24px #315bd636; }
    .login-card h1 { margin: 20px 0 5px; font-size: 1.55rem; letter-spacing: -.035em; }
    .login-card p { margin: 0 0 24px; color: var(--muted); line-height: 1.55; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 254px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 22px 15px 16px; color: #d5deef; background: var(--nav); }
    .side-brand { display: flex; align-items: center; gap: 11px; padding: 3px 10px 27px; color: white; }
    .side-brand .brand-mark { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 13px; font-size: 20px; }
    .side-brand strong { display: block; font-size: .96rem; letter-spacing: -.02em; }
    .side-brand small { display: block; margin-top: 3px; color: #8291ad; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
    .nav-caption { margin: 0 11px 9px; color: #7786a2; font-size: .69rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { display: flex; width: 100%; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-radius: 11px; color: #aab8d1; background: transparent; text-align: left; transition: .16s ease; }
    .nav-item:hover { color: white; background: #ffffff0e; }
    .nav-item.active { color: white; background: #315bd6; box-shadow: 0 8px 18px #07112755; }
    .nav-icon { width: 20px; color: inherit; text-align: center; font-size: 1.02rem; }
    .nav-count { min-width: 22px; margin-left: auto; padding: 2px 7px; border-radius: 20px; color: #d8e2ff; background: #ffffff18; font-size: .72rem; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding: 14px 9px 0; border-top: 1px solid #ffffff15; }
    .connection { display: flex; align-items: center; gap: 8px; color: #9cacc5; font-size: .78rem; }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #32c58a; box-shadow: 0 0 0 4px #32c58a22; }
    .main-column { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 5; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 13px clamp(20px, 3vw, 44px); border-bottom: 1px solid var(--line); background: #ffffffed; backdrop-filter: blur(14px); }
    .topbar h1 { margin: 0; font-size: 1.05rem; letter-spacing: -.02em; }
    .topbar p { margin: 4px 0 0; color: var(--muted); font-size: .8rem; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .search { position: relative; width: min(290px, 31vw); }
    .search input { width: 100%; padding-left: 36px; }
    .search span { position: absolute; top: 10px; left: 12px; color: #94a0b3; }
    .content-wrap { width: min(1540px, 100%); margin: 0 auto; padding: 25px clamp(18px, 3vw, 44px) 48px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-card { display: flex; align-items: center; gap: 13px; min-height: 91px; padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); box-shadow: 0 4px 13px #26385a06; }
    .stat-icon { display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center; border-radius: 13px; color: #315bd6; background: #edf1ff; font-size: 1.12rem; }
    .stat-card:nth-child(2) .stat-icon { color: #16845c; background: #e9f8f1; }
    .stat-card:nth-child(3) .stat-icon { color: #ad7221; background: #fff6e7; }
    .stat-card:nth-child(4) .stat-icon { color: #7255c5; background: #f2edff; }
    .stat-value { display: block; font-size: 1.25rem; font-weight: 800; letter-spacing: -.04em; }
    .stat-label { display: block; margin-top: 3px; color: var(--muted); font-size: .77rem; }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 0 0 15px; }
    .section-heading h2 { margin: 0; font-size: 1.15rem; letter-spacing: -.025em; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: .83rem; }
    .customer-layout { display: grid; grid-template-columns: minmax(245px, 315px) minmax(0, 1fr); gap: 16px; align-items: start; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 4px 15px #26385a07; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 17px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; font-size: .95rem; }
    .panel-body { padding: 17px; }
    .customer-list { display: grid; max-height: calc(100vh - 320px); min-height: 220px; overflow: auto; padding: 7px; }
    .customer-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; width: 100%; padding: 11px 10px; border: 0; border-radius: 11px; background: transparent; text-align: left; }
    .customer-row:hover { background: #f5f7fc; }
    .customer-row.selected { background: #edf2ff; }
    .avatar { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 11px; color: #315bd6; background: #e2eaff; font-weight: 800; }
    .customer-row strong { display: block; overflow: hidden; color: var(--ink); font-size: .83rem; text-overflow: ellipsis; white-space: nowrap; }
    .customer-row small { display: block; overflow: hidden; margin-top: 4px; color: var(--muted); font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
    .customer-row .mini-status { display: block; margin-top: 5px; color: #16845c; font-size: .66rem; font-weight: 800; text-transform: uppercase; }
    .customer-row.archived .mini-status { color: #a05b48; }
    .profile-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .profile-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .profile-title .avatar { width: 48px; height: 48px; border-radius: 14px; font-size: 1.03rem; }
    .profile-title h2 { margin: 0; overflow-wrap: anywhere; font-size: 1.12rem; letter-spacing: -.03em; }
    .profile-title p { margin: 5px 0 0; color: var(--muted); font-size: .78rem; }
    .profile-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; min-width: 0; color: #4e5c73; font-size: .76rem; font-weight: 750; }
    .field.full { grid-column: 1 / -1; }
    input, select { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #d9e0eb; border-radius: 9px; outline: none; color: var(--ink); background: white; transition: border-color .15s, box-shadow .15s; }
    input:focus, select:focus { border-color: #6c8df0; box-shadow: 0 0 0 3px #315bd61c; }
    input:disabled, select:disabled { color: #7d889c; background: #f4f6fa; }
    .btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 13px; border: 1px solid transparent; border-radius: 9px; color: white; background: var(--blue); font-size: .8rem; font-weight: 800; transition: .15s ease; }
    .btn:hover { background: var(--blue-dark); transform: translateY(-1px); }
    .btn:disabled { opacity: .56; cursor: wait; transform: none; }
    .btn.secondary { color: #34435a; border-color: #dce2ec; background: white; }
    .btn.secondary:hover { background: #f6f8fc; }
    .btn.ghost { color: #42536e; border-color: #e6eaf1; background: #f8f9fc; }
    .btn.danger { color: white; border-color: #ad2e29; background: var(--red); }
    .btn.danger:hover { background: #a82b26; }
    .btn.small { min-height: 34px; padding: 6px 10px; font-size: .74rem; }
    .btn.icon { width: 39px; min-width: 39px; padding: 0; }
    .helper { margin: 8px 0 0; color: var(--muted); font-size: .76rem; line-height: 1.5; }
    .divider { height: 1px; margin: 19px 0; background: var(--line); }
    .license-section { margin-top: 22px; }
    .license-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .license-head h3 { margin: 0; font-size: .95rem; }
    .license-stack { display: grid; gap: 11px; }
    .license-card { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: #fbfcff; }
    .license-card-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .license-card-top strong { display: block; font-size: .85rem; }
    .license-card-top small { display: block; margin-top: 4px; color: var(--muted); font-size: .72rem; overflow-wrap: anywhere; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 30px; color: #14734f; background: #e7f7ef; font-size: .68rem; font-weight: 850; white-space: nowrap; }
    .badge.off { color: #a04437; background: #fff0ed; }
    .badge.wait { color: #916313; background: #fff5df; }
    .license-fields { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(180px, 1fr); gap: 10px; }
    .license-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
    .empty-state { display: grid; min-height: 220px; place-items: center; padding: 25px; color: var(--muted); text-align: center; }
    .empty-icon { display: grid; width: 52px; height: 52px; margin: 0 auto 12px; place-items: center; border-radius: 17px; color: #5473d2; background: #edf2ff; font-size: 1.28rem; }
    .empty-state strong { display: block; margin-bottom: 4px; color: #314057; }
    .archive-toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .75rem; font-weight: 650; }
    .archive-toggle input { width: 16px; min-height: 16px; margin: 0; accent-color: var(--blue); }
    .edition-grid, .installation-grid { display: grid; gap: 12px; }
    .edition-card { display: grid; grid-template-columns: minmax(140px, 1.4fr) minmax(125px, .8fr) minmax(125px, .8fr) auto auto; gap: 12px; align-items: end; padding: 15px; }
    .edition-card .field { font-size: .7rem; }
    .edition-card .field input { min-height: 39px; }
    .switch-field { display: flex; align-items: center; gap: 7px; min-height: 39px; color: #56657b; font-size: .74rem; font-weight: 750; }
    .switch-field input { width: 17px; min-height: 17px; accent-color: var(--blue); }
    .installation-card { padding: 15px; }
    .installation-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .installation-top strong { display: block; font-size: .87rem; }
    .installation-top .muted { margin-top: 5px; }
    .muted { color: var(--muted); font-size: .75rem; line-height: 1.55; overflow-wrap: anywhere; }
    .installation-actions { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; margin-top: 14px; }
    .installation-actions .field { width: min(360px, 100%); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: #0c172acc; backdrop-filter: blur(4px); }
    .modal { width: min(520px, 100%); padding: 23px; border: 1px solid #e2e7f0; border-radius: 18px; background: white; box-shadow: 0 28px 100px #0004; }
    .modal-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .modal-head h2 { margin: 0; font-size: 1.03rem; }
    .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: .78rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 30; max-width: min(420px, calc(100vw - 34px)); padding: 13px 17px; border: 1px solid #d7e2dc; border-radius: 12px; color: #155b42; background: #f0fff7; box-shadow: 0 12px 35px #15294a20; font-size: .82rem; line-height: 1.45; }
    .toast.error { color: #982b25; border-color: #f0d0cc; background: #fff5f3; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (max-width: 1100px) {
      .app-shell { grid-template-columns: 220px minmax(0, 1fr); }
      .edition-card { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .edition-card .edition-save { grid-column: 2; justify-self: end; }
    }
    @media (max-width: 760px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; z-index: 8; height: auto; padding: 9px 12px; }
      .side-brand { display: none; }
      .nav-caption, .sidebar-bottom { display: none; }
      .nav-list { display: flex; overflow-x: auto; gap: 5px; scrollbar-width: none; }
      .nav-item { width: auto; flex: 0 0 auto; padding: 9px 11px; font-size: .76rem; }
      .nav-icon { width: auto; }
      .nav-count { min-width: 18px; padding: 2px 5px; }
      .topbar { position: static; min-height: 65px; }
      .top-actions .search { display: none; }
      .content-wrap { padding-top: 16px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .stat-card { min-height: 76px; padding: 12px; }
      .customer-layout { grid-template-columns: 1fr; }
      .customer-list { max-height: 250px; min-height: 120px; }
      .profile-header { flex-direction: column; }
      .profile-actions { justify-content: flex-start; }
    }
    @media (max-width: 480px) {
      .content-wrap { padding-right: 12px; padding-left: 12px; }
      .topbar { padding-right: 13px; padding-left: 13px; }
      .stats { gap: 7px; }
      .stat-card { gap: 9px; padding: 10px; }
      .stat-icon { width: 34px; height: 34px; flex-basis: 34px; }
      .stat-value { font-size: 1.05rem; }
      .stat-label { font-size: .68rem; }
      .panel-body { padding: 13px; }
      .form-grid, .license-fields { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .license-card-top { flex-direction: column; }
      .edition-card { grid-template-columns: 1fr; }
      .edition-card .edition-save { grid-column: auto; justify-self: stretch; }
      .section-heading { align-items: flex-start; }
      .section-heading > .btn { flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="brand-mark" aria-hidden="true">🔐</div>
      <h1>License Manager</h1>
      <p>Διαχείριση πελατών, αδειών και εγκαταστάσεων RestaurantOrders.</p>
      <label class="field">Κωδικός διαχειριστή
        <input id="password" type="password" autocomplete="current-password" required autofocus placeholder="Κωδικός License Manager">
      </label>
      <p id="login-error" class="helper" role="alert"></p>
      <button id="login-button" class="btn" style="width:100%;margin-top:16px" type="submit">Σύνδεση</button>
    </form>
  </section>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar" aria-label="Κύρια πλοήγηση">
      <div class="side-brand">
        <div class="brand-mark" aria-hidden="true">🔐</div>
        <div><strong>RestaurantOrders</strong><small>License Manager</small></div>
      </div>
      <p class="nav-caption">Διαχείριση</p>
      <nav class="nav-list">
        <button class="nav-item active" type="button" data-view="customers"><span class="nav-icon">♙</span> Πελάτες <span id="customer-count" class="nav-count">0</span></button>
        <button class="nav-item" type="button" data-view="editions"><span class="nav-icon">▣</span> Εκδόσεις αδειών</button>
        <button class="nav-item" type="button" data-view="installations"><span class="nav-icon">▦</span> Εγκαταστάσεις <span id="installation-count" class="nav-count">0</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="connection"><span class="connection-dot"></span> Συνδεδεμένο με τον server</div></div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div><h1 id="page-title">Πελάτες</h1><p id="page-subtitle">Καρτέλες καταστημάτων, στοιχεία και άδειες χρήσης.</p></div>
        <div class="top-actions">
          <label class="search"><span aria-hidden="true">⌕</span><input id="customer-search" type="search" placeholder="Αναζήτηση πελάτη…" aria-label="Αναζήτηση πελάτη"></label>
          <button id="logout" class="btn secondary small" type="button">Αποσύνδεση</button>
        </div>
      </header>

      <main class="content-wrap">
        <section id="stats" class="stats" aria-label="Σύνοψη"></section>
        <div id="content"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
    let managerPassword = '';
    let dashboard = { customers: [], licenses: [], installations: [], editions: [] };
    let activeView = 'customers';
    let selectedCustomerId = null;
    let showArchived = false;
    let toastTimer;
    const byId = id => document.getElementById(id);
    const content = byId('content');
    const titles = {
      customers: ['Πελάτες', 'Καρτέλες καταστημάτων, στοιχεία και άδειες χρήσης.'],
      editions: ['Εκδόσεις αδειών', 'Ορισμός διαθέσιμων προγραμμάτων και ορίων εγκαταστάσεων.'],
      installations: ['Εγκαταστάσεις', 'Σύνδεση, ανάθεση και επανασύνδεση συσκευών.']
    };
    const element = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    const field = (labelText, control, className = '') => {
      const label = element('label', `field ${className}`.trim(), labelText);
      label.append(control);
      return label;
    };
    const input = (name, value = '', type = 'text', required = false) => {
      const control = document.createElement('input');
      control.name = name;
      control.type = type;
      control.value = value ?? '';
      control.required = required;
      return control;
    };
    const option = (select, text, value) => select.append(new Option(text, value));
    const formatDate = value => value ? new Intl.DateTimeFormat('el-GR', { dateStyle: 'medium' }).format(new Date(value)) : 'Χωρίς λήξη';
    const dateValue = value => value ? new Date(value).toISOString().slice(0, 10) : '';
    const dateToUtc = value => value ? new Date(`${value}T23:59:59`).toISOString() : null;
    const activeLicense = license => license.status === 'active' && (!license.expiresAtUtc || new Date(license.expiresAtUtc) > new Date());

    function authHeader() {
      const bytes = new TextEncoder().encode(`manager:${managerPassword}`);
      let binary = '';
      for (const value of bytes) binary += String.fromCharCode(value);
      return `Basic ${btoa(binary)}`;
    }
    async function api(path, method = 'GET', body) {
      const headers = { Authorization: authHeader() };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body),
        cache: 'no-store'
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || `Αποτυχία αιτήματος (${response.status}).`);
      return result;
    }
    function toast(message, error = false) {
      const box = byId('toast');
      box.textContent = message;
      box.classList.toggle('error', error);
      box.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add('hidden'), 4200);
    }
    async function refreshDashboard() {
      dashboard = await api('/api/license-manager/v1/dashboard');
      dashboard.customers ||= [];
      dashboard.licenses ||= [];
      dashboard.installations ||= [];
      dashboard.editions ||= [];
      byId('customer-count').textContent = String(dashboard.customers.filter(item => item.isActive).length);
      byId('installation-count').textContent = String(dashboard.installations.length);
      drawStats();
      drawView();
    }
    function drawStats() {
      const activeCustomers = dashboard.customers.filter(item => item.isActive).length;
      const validLicenses = dashboard.licenses.filter(activeLicense).length;
      const pending = dashboard.installations.filter(item => !item.isAssigned).length;
      const activeEditions = dashboard.editions.filter(item => item.isActive).length;
      const items = [
        ['♙', activeCustomers, 'Ενεργοί πελάτες'],
        ['▣', validLicenses, 'Ενεργές άδειες'],
        ['◷', pending, 'Σε αναμονή ενεργοποίησης'],
        ['◇', activeEditions, 'Διαθέσιμες εκδόσεις']
      ];
      const root = byId('stats');
      root.replaceChildren(...items.map(([icon, value, label]) => {
        const card = element('article', 'stat-card');
        card.append(element('span', 'stat-icon', icon));
        const info = element('div');

    function drawLicenseCard(license, customerIsActive) {

      top.append(info, element('span', `badge${active ? '' : ' off'}`, active ? 'ΕΝΕΡΓΗ' : license.status === 'revoked' || !customerIsActive ? 'ΑΠΕΝΕΡΓΟΠΟΙΗΜΕΝΗ' : 'ΛΗΞΗ'));

          await api(`/api/license-manager/v1/licenses/${license.id}/renew`, 'PUT', { expiresAtUtc: date });

          await refreshDashboard(); toast('Η έκδοση και η λήξη της άδειας ενημερώθηκαν.');

          }
          const detach = element('button', 'btn danger small'); detach.type = 'button'; detach.textContent = 'Ανάκληση συσκευής';
          detach.addEventListener('click', async () => {
            if (!confirm(`Να ανακληθεί η άδεια από τον υπολογιστή «${installation.machineName}»;`)) return;
            try { await api(`/api/license-manager/v1/installations/${installation.installationId}/detach`, 'POST'); await refreshDashboard(); toast('Η συσκευή αποσυνδέθηκε από την άδεια.'); }
            catch (error) { toast(error.message, true); }
          });
          actions.append(detach);
        }
        card.append(actions); list.append(card);
      }
      content.replaceChildren(heading, list);
    }

    document.querySelectorAll('.nav-item').forEach(nav => nav.addEventListener('click', () => { activeView = nav.dataset.view; drawView(); }));
    byId('customer-search').addEventListener('input', () => { if (activeView === 'customers') drawCustomers(); });
    byId('logout').addEventListener('click', () => {
      managerPassword = ''; dashboard = { customers: [], licenses: [], installations: [], editions: [] };
      byId('app').classList.add('hidden'); byId('login-screen').classList.remove('hidden'); byId('password').value = ''; byId('password').focus();
    });
    byId('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = byId('login-button'); button.disabled = true; button.textContent = 'Σύνδεση…';
      byId('login-error').textContent = '';
      managerPassword = byId('password').value;
      try {
        await refreshDashboard();
        byId('login-screen').classList.add('hidden'); byId('app').classList.remove('hidden');
        selectedCustomerId = dashboard.customers.find(item => item.isActive)?.id || dashboard.customers[0]?.id || null;
        drawView();
      } catch (error) {
        managerPassword = '';
        byId('login-error').textContent = error.message === 'Αποτυχία αιτήματος (401).' ? 'Ο κωδικός δεν είναι σωστός.' : error.message;
      } finally { button.disabled = false; button.textContent = 'Σύνδεση'; }
    });
  </script>
</body>
</html>

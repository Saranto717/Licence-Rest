name: Cloud build and Dockhand release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build Docker image
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ci_restaurant
      POSTGRES_ADMIN_USER: ci_admin
      POSTGRES_ADMIN_PASSWORD: ci-placeholder-admin-password
      CLOUD_APP_USER: ci_app
      CLOUD_APP_PASSWORD: ci-placeholder-app-password
      CLOUD_ADMIN_KEY: ci-placeholder-admin-key
      LICENSE_MANAGER_PASSWORD: ci-placeholder-manager-password
      LICENSE_SIGNING_PRIVATE_KEY_B64: Y2ktcGxhY2Vob2xkZXI=
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the Dockerfile
        run: docker compose build --pull cloud-api

  deploy:
    name: Deploy tagged release through Dockhand
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and target
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable version tag such as v1.0.2." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "The release tag must point to the current main commit." >&2
            exit 1
          fi

      - name: Trigger Dockhand to pull the Git stack and rebuild
        env:
          DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        shell: bash
        run: |
          : "${DOCKHAND_WEBHOOK_URL:?Add DOCKHAND_WEBHOOK_URL to repository Actions secrets}"
          : "${DOCKHAND_WEBHOOK_SECRET:?Add DOCKHAND_WEBHOOK_SECRET to repository Actions secrets}"
          payload='{}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DOCKHAND_WEBHOOK_SECRET" | awk '{print $NF}')"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            -X POST "$DOCKHAND_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $signature" \
            --data "$payload"


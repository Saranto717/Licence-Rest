name: restaurant-orders-cloud

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Dockhand}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in Dockhand}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in Dockhand}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CLOUD_APP_USER: ${CLOUD_APP_USER:?Set CLOUD_APP_USER in Dockhand}
      CLOUD_APP_PASSWORD: ${CLOUD_APP_PASSWORD:?Set CLOUD_APP_PASSWORD in Dockhand}
      TZ: UTC
    volumes:
      - ./init/001-create-app-user.sh:/docker-entrypoint-initdb.d/001-create-app-user.sh:ro
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  cloud-api:
    image: restaurantorders-cloud-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Cloud__DatabaseHost: postgres
      Cloud__DatabasePort: "5432"
      Cloud__DatabaseName: ${POSTGRES_DB:?Set POSTGRES_DB in Dockhand}
      Cloud__DatabaseUser: ${CLOUD_APP_USER:?Set CLOUD_APP_USER in Dockhand}
      Cloud__DatabasePassword: ${CLOUD_APP_PASSWORD:?Set CLOUD_APP_PASSWORD in Dockhand}
      Cloud__AdminKey: ${CLOUD_ADMIN_KEY:?Set CLOUD_ADMIN_KEY in Dockhand}
      Cloud__LicenseManagerPassword: ${LICENSE_MANAGER_PASSWORD:?Set LICENSE_MANAGER_PASSWORD in Dockhand}
      Cloud__LicenseSigningPrivateKeyBase64: ${LICENSE_SIGNING_PRIVATE_KEY_B64:?Set LICENSE_SIGNING_PRIVATE_KEY_B64 in Dockhand}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CLOUD_API_BIND_ADDRESS:-127.0.0.1}:${CLOUD_API_PORT:-8080}:8080"
    networks:
      - database

networks:
  database:
    internal: true

volumes:
  postgres-data:


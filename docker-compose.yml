name: restaurant-orders-cloud

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_cloud}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-restaurant_cloud_admin}
      POSTGRES_PASSWORD: ${POSTGRESS_PASSWORD:-service123#}
      #POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      #POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CLOUD_APP_USER: ${CLOUD_APP_USER:-restaurant_cloud_app}
      CLOUD_APP_PASSWORD_FILE: ${CLOUD_APP_PASSWORD_FILE:-service123#}
      TZ: Europe/Athens
  
    volumes:
      - ./init/001-create-app-user.sh:/docker-entrypoint-initdb.d/001-create-app-user.sh:ro
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  cloud-api:
    image: ghcr.io/saranto717/restaurantorders-cloud-api:${CLOUD_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Cloud__DatabaseHost: postgres
      Cloud__DatabasePort: "5432"
      Cloud__DatabaseName: ${POSTGRES_DB:-restaurant_cloud}
      Cloud__DatabaseUser: ${CLOUD_APP_USER:-restaurant_cloud_app}
      Cloud__DatabasePasswordFile: ${CLOUD_APP_PASSWORD_FILE:-service123#}
      Cloud__AdminKeyFile: /run/secrets/cloud_admin_key
      Cloud__LicenseManagerPasswordFile: ${CLOUD_APP_PASSWORD_FILE}
      Cloud__LicenseSigningPrivateKeyFile: /run/secrets/license_signing_private_key

    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CLOUD_API_BIND_ADDRESS:-0.0.0.0}:${CLOUD_API_PORT:-18080}:8080"
    networks:
      - database

networks:
  database:
    internal: true

volumes:
  postgres-data:


